# General Settings
seed: 42
device: "cuda"
use_wandb: false
project_name: "ssl-byol-eurosat"

# Data Path
data_dir: "./data/EuroSAT"

# Dataset Settings
image_size: 64
batch_size: 64
num_workers: 2

# BYOL Model Hyperparameters
backbone: "resnet18"
projection_dim: 256
hidden_dim: 4096
moving_average_decay: 0.996
tau_base: 0.996

# Pretraining Hyperparameters
lr: 0.0003
weight_decay: 0.000001
epochs: 200
warmup_epochs: 10
fp16: true
use_amp: true

# Fine-tuning Hyperparameters
finetune_lr: 0.001
finetune_epochs: 150
labeled_splits: [0.10] # Focusing on the best possible result for the final model

# Evaluation Settings
knn_k: 200
knn_sigma: 0.1
tsne_samples: 1000
